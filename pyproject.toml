[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-pricing-segmentation-lab"
version = "0.1.0"
description = "Synthetic personal auto pricing and portfolio impact analysis"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

